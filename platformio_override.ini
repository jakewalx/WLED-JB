# PlatformIO Project Configuration Override for ESP32-S3 with Custom Access Point
# ------------------------------------------------------------------------------
# This file overrides settings for ESP32-S3 builds with custom access point configuration
# ------------------------------------------------------------------------------

[platformio]
default_envs = esp32S3_8MB_M

[env:esp32S3_8MB_M]
board = esp32-s3-devkitc-1
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags_esp32}
    -D WLED_USE_MY_CONFIG
    -D WLED_WIFI_RETRIES=10
    -D WLED_WIFI_TIMEOUT=20
    -D WLED_NO_WIFI_SLEEP=true
lib_deps = ${esp32.lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}

# Alternative ESP32-S3 configurations
[env:esp32S3_4MB_S]
board = esp32-s3-devkitc-1
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags_esp32}
    -D WLED_USE_MY_CONFIG
    -D WLED_WIFI_RETRIES=10
    -D WLED_WIFI_TIMEOUT=20
    -D WLED_NO_WIFI_SLEEP=true
lib_deps = ${esp32.lib_deps}

[env:esp32S3_8MB_PSRAM_M]
board = esp32-s3-devkitc-1
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags_esp32}
    -D WLED_USE_MY_CONFIG
    -D WLED_AP_SSID='"al"'
    -D WLED_AP_PASS='"alienlights"'
    -D WLED_AP_ONLY=false
    -D WLED_WIFI_RETRIES=10
    -D WLED_WIFI_TIMEOUT=20
    -D WLED_NO_WIFI_SLEEP=true
    -D WLED_AP_BEHAVIOR=AP_BEHAVIOR_NO_CONN
    -DBOARD_HAS_PSRAM
    -D WLED_USE_PSRAM_JSON
    -DALL_JSON_TO_PSRAM
lib_deps = ${esp32.lib_deps}
