[platformio]
default_envs = esp32dev_fld

[env:esp32dev_fld]
extends = env:esp32dev_V4
custom_usermods = ${env:esp32dev_V4.custom_usermods} four_line_display_ALT
build_flags =
    ${env:esp32dev_V4.build_flags}
    -D FLD_TYPE=SSD1351_128X128
    -D FLD_PIN_CS=15      ; change to your actual CS pin
    -D FLD_PIN_DC=19      ; change to your actual DC pin
    -D FLD_PIN_RESET=26   ; change to your actual RST pin (or -1 if not used)
